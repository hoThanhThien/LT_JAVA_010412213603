services:
  mysql:
    image: mariadb:11.4
    container_name: heramo-mysql
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-laundry}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env or environment}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./LS-BackEnd/laundry
      dockerfile: Dockerfile
    container_name: heramo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-laundry}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env or environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (>=32 chars) in root .env or environment}
      JWT_ACCESS_DURATION: ${JWT_ACCESS_DURATION:-1800000}
      JWT_REFRESH_DURATION: ${JWT_REFRESH_DURATION:-604800000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CASSO_API_KEY: ${CASSO_API_KEY:-}
      BANK_ACCOUNT_HOLDER: ${BANK_ACCOUNT_HOLDER:-}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://localhost}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 35s

  frontend:
    build:
      context: ./LS-FrontEnd
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_ENDPOINT: http://backend:8080
        NEXT_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    container_name: heramo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_ENDPOINT: http://backend:8080
      NEXT_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (>=32 chars) in root .env or environment}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx-https:
    image: nginx:1.27-alpine
    container_name: heramo-nginx-https
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  mysql_data:
