name: CI Pipeline

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: laundry
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Backend Maven Tests
        working-directory: LS-BackEnd/laundry
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/laundry?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
          DB_USERNAME: root
          DB_PASSWORD: ""
          JWT_SECRET: ci-test-jwt-secret-key-with-at-least-32-characters-123456
          BANK_ACCOUNT_HOLDER: HERAMO TEST
          BANK_ACCOUNT_NUMBER: "0123456789"
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: chmod +x mvnw && ./mvnw -B test

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: LS-FrontEnd/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: LS-FrontEnd
        run: npm ci

      - name: TypeScript Typecheck & ESLint
        working-directory: LS-FrontEnd
        env:
          NEXT_PUBLIC_API_ENDPOINT: http://localhost:8080
          NEXT_PUBLIC_URL: http://localhost:3000
          JWT_SECRET: ci-test-jwt-secret-key-with-at-least-32-characters-123456
        run: |
          npx tsc --noEmit
          npm run lint
