# Isolated H2 test configuration so automated tests run offline without external MySQL/MariaDB
spring.config.import=
spring.datasource.url=jdbc:h2:mem:laundry_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test secrets & defaults
jwt.secret=test-jwt-secret-key-at-least-32-characters-long-123456
jwt.access.duration=1800000
jwt.refresh.duration=604800000
firebase.config.path=nonexistent-test-firebase.json
firebase.project-id=heramo-b5a4c
casso.polling.enabled=false
spring.devtools.restart.enabled=false
casso.polling-interval-ms=3600000
casso.polling-interval=3600000
casso.api-key=test-key
account-holder=Test Account
account-number=0000000000
viet-qr-url=https://img.vietqr.io/image
