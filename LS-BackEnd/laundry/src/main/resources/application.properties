# ===========================================
# Spring Boot Configuration (Non-secret defaults & env mappings)
# Secrets MUST be stored in .env (next to pom.xml) or OS environment variables.
# See LS-BackEnd/laundry/.env.example
# ===========================================
spring.config.import=optional:file:.env[.properties],optional:file:LS-BackEnd/laundry/.env[.properties]
spring.application.name=laundry
server.port=${SERVER_PORT:8080}

# Database (MySQL / MariaDB)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
logging.level.com.example.laundry=${APP_LOG_LEVEL:DEBUG}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access.duration=${JWT_ACCESS_DURATION:1800000}
jwt.refresh.duration=${JWT_REFRESH_DURATION:604800000}

# Email (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Firebase Admin SDK
firebase.config.path=${FIREBASE_CONFIG_PATH:firebase-service-account.json}

# Payment (Casso & VietQR)
casso.base-url=${CASSO_BASE_URL:https://oauth.casso.vn/v2/transactions}
casso.polling-interval-ms=${CASSO_POLLING_INTERVAL_MS:35000}
casso.polling-interval=${CASSO_POLLING_INTERVAL_MS:35000}
casso.api-key=${CASSO_API_KEY:}

# Bank / VietQR
account-holder=${BANK_ACCOUNT_HOLDER:}
account-number=${BANK_ACCOUNT_NUMBER:}
viet-qr-url=${VIET_QR_URL:https://img.vietqr.io/image}

# Local dev data seed (off by default)
app.seed.enabled=${APP_SEED_ENABLED:false}
