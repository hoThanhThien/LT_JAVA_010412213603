# Bí mật (mật khẩu DB, mail, khóa JWT...) KHÔNG để ở đây. Đặt trong file .env cạnh pom.xml hoặc biến môi trường.
# Xem .env.example
spring.config.import=optional:file:.env[.properties]

#Database Mysql
spring.application.name=laundry
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
logging.level.com.example.laundry=DEBUG

#Token jwt
jwt.secret=${JWT_SECRET}
jwt.access.duration=1800000
jwt.refresh.duration=604800000

#Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Firebase
firebase.config.path=firebase-service-account.json

#Casso
casso.base-url=https://oauth.casso.vn/v2/transactions
casso.polling-interval-ms=35000
casso.api-key=${CASSO_API_KEY}

